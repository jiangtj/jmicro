server.port=17001
spring.application.name=demo-backend
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.max-file-size=10MB

# jackson & serialization
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.time-zone=GMT+8
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.mvc.problemdetails.enabled=true
spring.mvc.format.date-time=yyyy-MM-dd HH:mm:ss
spring.data.web.pageable.serialization-mode=VIA_DTO

# datasource
spring.datasource.url=jdbc:h2:mem:demo-backend;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=SYSTEM_USER;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# management config
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*

# 权限点与前端一一对应，采用简单字符串匹配（不做 ant 通配）
jmicro.auth.permission-match=simple

# 系统配置（覆盖值持久化到 sys_config 表，管理接口见 /system/configs）
jmicro.config.enabled=true

# demo jwt（HS256，secret 至少 32 字节）
jmicro.demo.jwt.issuer=jmicro-demo
jmicro.demo.jwt.secret=jmicro-demo-secret-key-change-me-0123456789
jmicro.demo.jwt.ttl=2h
