# Project
group=com.jiangtj.micro
version=0.3.1

# Gradle performance
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Kotlin
kotlin.code.style=official

# --- Maven Central publishing (vanniktech/gradle-maven-publish-plugin) ---
# Publish to Maven Central and sign every publication.
mavenCentralPublishing=true
signAllPublications=true
# Publish automatically from the Portal after upload (no manual "Publish" click).
# Set to false to do a manual drop/release from the Central Portal instead.
mavenCentralAutomaticPublishing=true
# Emit modern checksums for all artifacts (in addition to the md5/sha1 default).
mavenCentralChecksums=md5,sha1,sha256,sha512
mavenCentralExcludeSignatureChecksums=false

# Publishing credentials and signing keys are intentionally NOT stored here.
# Put them in your user-level ~/.gradle/gradle.properties (or env vars):
#   mavenCentralUsername=<Central Portal user token>
#   mavenCentralPassword=<Central Portal user token password>
#   signing.keyId=<key id>            (file-based signing)
#   signing.password=<key passphrase>
#   signing.secretKeyRingFile=<path>  (file-based signing)
# or, for in-memory signing:
#   ORG_GRADLE_PROJECT_signingInMemoryKey=<armored private key>
#   ORG_GRADLE_PROJECT_signingInMemoryKeyId=<key id>
#   ORG_GRADLE_PROJECT_signingInMemoryKeyPassword=<key passphrase>
