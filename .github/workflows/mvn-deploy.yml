name: Maven Deploy

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with: # running setup-java again overwrites the settings.xml
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          server-id: central # Value of the repository/id of the publishing configuration
          server-username: MAVEN_USERNAME # env variable for username in publish
          server-password: MAVEN_CENTRAL_TOKEN # env variable for token in publish
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }} # Value of the GPG private key to import
          gpg-passphrase: MAVEN_GPG_PASSPHRASE # env variable for GPG private key passphrase
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Test with Gradle
        run: ./gradlew test
      - name: Publish to Apache Maven Central
        run: ./gradlew publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
