# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll and Gradle Site with GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Build the Jekyll site
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # Prepare the merged static site directory
      - name: Set up temp site dir
        run: mkdir -p ./temp_site && cp -r ./_site/* ./temp_site

      # Build API docs with Gradle (Dokka HTML for Java + Kotlin)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate Dokka HTML (per module)
        run: ./gradlew dokkaGenerate --no-daemon
        continue-on-error: true

      - name: Move dokka into site
        run: |
          for m in micro-common micro-web micro-auth micro-auth-oidc micro-spring-boot-starter micro-sql-jooq micro-test micro-pic-upload-starter micro-flyway-starter; do
            if [ -d "./$m/build/dokka/html" ]; then
              mkdir -p "./temp_site/$m/api"
              cp -r "./$m/build/dokka/html/." "./temp_site/$m/api"
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './temp_site'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
