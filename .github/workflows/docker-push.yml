# Build the demo-backend image with Spring Boot's bootBuildImage and publish it to GitHub Container Registry.
# For more information see: https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-container-registry

name: Docker Push

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/jmicro-demo-backend
  # bootBuildImage 的构建产物平台，显式固定为 amd64，避免在 arm64 运行器/构建器上出现
  # "exec /cnb/lifecycle/creator: exec format error"
  IMAGE_PLATFORM: linux/amd64
  # Spring Boot 4 默认的 paketobuildpacks/builder-noble-java-tiny:latest 目前只提供 arm64 变体，
  # 在 amd64 运行器上会报 platform mismatch，改用同时提供 amd64 的 jammy-base builder
  BUILDER_IMAGE: paketobuildpacks/builder-jammy-base

jobs:
  build:
    # 显式使用 amd64 运行器（ubuntu-24.04），保证 buildpacks 生命周期与目标镜像架构一致
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Show build environment
        run: |
          uname -m
          docker version --format 'server arch: {{.Server.Arch}}'
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # list of Docker images to use as base name for tags
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=schedule
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Image
        run: |
          ./gradlew :demo-backend:bootBuildImage \
            --imageName=${{ env.IMAGE_NAME }} \
            --imagePlatform=${{ env.IMAGE_PLATFORM }} \
            --builder=${{ env.BUILDER_IMAGE }} \
            -x test
      - name: Push
        run: |
          # 读取并应用所有标签
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            [ -z "$tag" ] && continue
            docker tag $IMAGE_NAME "$tag"
            echo "已创建标签: $tag"
          done
          docker push -a ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
