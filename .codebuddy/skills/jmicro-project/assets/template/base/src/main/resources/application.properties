server.port=__PORT__
spring.application.name=__PROJECT_NAME__

# jackson（JsonUtils 已由 micro-web 自动配置初始化，无需自定义 ObjectMapper）
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.time-zone=GMT+8
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# management
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*

# 权限点与前端一一对应，采用简单字符串匹配（需要 book:* / book:** 通配时改为 ant）
jmicro.auth.permission-match=simple

# 应用自定义 JWT（HS256，secret 至少 32 字节，生产环境务必替换）
# 只把角色写进 token，权限由角色解析（改权限无需重新登录）
jmicro.app.jwt.issuer=__PROJECT_NAME__
jmicro.app.jwt.secret=change-me-__PROJECT_NAME__-0123456789abcdef0123456789abcdef
jmicro.app.jwt.ttl=2h

# #if db
spring.datasource.url=jdbc:h2:mem:__PROJECT_NAME__;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=SYSTEM_USER;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.locations=classpath:/db/migration
# #endif

# #if config|pic
# 系统配置能力（图片上传 / 动态配置项依赖它，默认关闭）
# 有 db 特性时覆盖值持久化在 sys_config 表，管理接口见 /system/configs
jmicro.config.enabled=true
# #endif
